# ============================================
# AI 自动化测试框架 — CI/CD 流水线
# ============================================
# 触发条件：
#   push/PR 到 main → 自动跑全量测试
#   每天凌晨 2:00 UTC → 定时巡检
# ============================================

name: AI API Test Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 2 * * *'  # 每天凌晨 2:00 UTC（北京时间 10:00）

# 并发控制：同一分支多个提交只跑最新的
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 权限设置：允许发布 GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ========== Step 1: 检出代码 ==========
      - name: 检出代码
        uses: actions/checkout@v4

      # ========== Step 2: 安装 Python ==========
      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # ========== Step 3: 安装依赖 ==========
      - name: 安装 Python 依赖
        run: pip install -r requirements.txt

      # ========== Step 4: 安装 Allure CLI ==========
      - name: 安装 Allure CLI
        id: install-allure
        continue-on-error: true
        run: |
          set -e
          ALLURE_VERSION="2.44.0"
          echo "尝试安装 Allure ${ALLURE_VERSION} ..."

          # 方法1：使用 .deb 包安装（Ubuntu 最稳定）
          if command -v dpkg >/dev/null 2>&1; then
            echo "方法1：使用 .deb 包安装"
            curl -L --retry 3 --retry-delay 2 -o allure.deb "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure_${ALLURE_VERSION}-1_all.deb" || true
            if [ -f allure.deb ] && [ -s allure.deb ]; then
              sudo dpkg -i allure.deb || sudo apt-get install -f -y
              if command -v allure >/dev/null 2>&1; then
                echo "✅ Allure 通过 .deb 安装成功"
                allure --version
                exit 0
              fi
            fi
          fi

          # 方法2：解压 tgz 包
          echo "方法2：使用 tgz 包安装"
          curl -L --retry 3 --retry-delay 2 -o allure.tgz "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" || true
          if [ -f allure.tgz ] && [ -s allure.tgz ]; then
            tar -xzf allure.tgz
            echo "$PWD/allure-${ALLURE_VERSION}/bin" >> $GITHUB_PATH
            chmod +x "$PWD/allure-${ALLURE_VERSION}/bin/allure"
            "$PWD/allure-${ALLURE_VERSION}/bin/allure" --version
            echo "✅ Allure 通过 tgz 安装成功"
            exit 0
          fi

          echo "❌ Allure 安装失败，后续将跳过 Allure 报告生成"
          exit 1

      # ========== Step 5: 运行全量测试 ==========
      - name: 运行全量测试
        run: |
          pytest tests/ -v --tb=long \
            --alluredir=reports/allure-results \
            --clean-alluredir \
            --html=reports/report.html --self-contained-html \
            2>&1 | tee reports/pytest-output.log
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AI_MODE: ${{ secrets.DEEPSEEK_API_KEY != '' && 'real' || 'mock' }}

      # ========== Step 6: 生成 Allure 报告 ==========
      - name: 生成 Allure 报告
        if: always() && steps.install-allure.outcome == 'success'
        run: |
          allure generate reports/allure-results -o reports/allure-report --clean

      # ========== Step 7: 上传测试日志和报告 ==========
      - name: 上传 pytest 详细日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output-log
          path: reports/pytest-output.log

      - name: 上传 pytest-html 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report
          path: reports/report.html

      # ========== Step 8: 上传 Allure 报告 ==========
      - name: 上传 Allure 报告
        if: always() && steps.install-allure.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: reports/allure-report/

      # ========== Step 9: 发布到 GitHub Pages ==========
      - name: 发布 Allure 报告到 GitHub Pages
        if: github.ref == 'refs/heads/main' && always() && steps.install-allure.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: reports/allure-report
          keep_files: false
          full_commit_message: "📊 自动发布 Allure 测试报告"

      # ========== Step 10: 输出测试总结 ==========
      - name: 📋 测试摘要
        if: always()
        run: |
          echo "========================================="
          echo "  pytest-html 报告：在 Actions 页面下载 artifact 'pytest-html-report'"
          if [ "${{ steps.install-allure.outcome }}" == "success" ]; then
            echo "  Allure 在线报告：https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          else
            echo "  Allure 报告未生成（Allure CLI 安装失败）"
          fi
          echo "========================================="
